<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 06 - Forms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Job Application Form</h1>

    <form id="applicationForm" method="post" action="http://mercury.swin.edu.au/it000000/formtest.php" novalidate>
      <fieldset>
        <legend>Personal Details</legend>

        <label for="firstName">First Name *</label>
        <input type="text" id="firstName" name="firstName" required>
        <p class="error" id="firstNameError"></p>

        <label for="lastName">Last Name *</label>
        <input type="text" id="lastName" name="lastName" required>
        <p class="error" id="lastNameError"></p>

        <label for="username">Username *</label>
        <input type="text" id="username" name="username" required>
        <p class="error" id="usernameError"></p>

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
        <p class="error" id="emailError"></p>

        <label for="mobile">Mobile Number *</label>
        <input type="text" id="mobile" name="mobile" required>
        <p class="error" id="mobileError"></p>

        <label for="dob">Date of Birth *</label>
        <input type="date" id="dob" name="dob" required>
        <p class="error" id="dobError"></p>
      </fieldset>

      <fieldset>
        <legend>Security</legend>

        <label for="password">Password *</label>
        <input type="password" id="password" name="password" required>
        <p class="error" id="passwordError"></p>

        <label for="confirmPassword">Confirm Password *</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <p class="error" id="confirmPasswordError"></p>
      </fieldset>

      <fieldset>
        <legend>Address and Preferences</legend>

        <label for="street">Street Address</label>
        <input type="text" id="street" name="street">
        <p class="error" id="streetError"></p>

        <label for="suburb">Suburb</label>
        <input type="text" id="suburb" name="suburb">
        <p class="error" id="suburbError"></p>

        <label for="postcode">Postcode *</label>
        <input type="text" id="postcode" name="postcode" required>
        <p class="error" id="postcodeError"></p>

        <label for="jobCategory">Preferred Job Category *</label>
        <select id="jobCategory" name="jobCategory" required>
          <option value="">-- Select a category --</option>
          <option value="AI">AI</option>
          <option value="Data Science">Data Science</option>
          <option value="Web Development">Web Development</option>
        </select>
        <p class="error" id="jobCategoryError"></p>
      </fieldset>

      <div class="button-row">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="button" id="toggleTermsBtn">Terms and Conditions</button>
      </div>

      <section id="termsBox" class="terms hidden">
        <h2>Terms and Conditions</h2>
        <p>
          This is placeholder text for terms and conditions. By submitting this form, you
          agree that your data is used for class lab testing purposes only.
        </p>
      </section>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>

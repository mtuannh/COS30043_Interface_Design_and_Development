<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab 04 - Guessing Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div id="app" class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h1 class="h3 mb-4">Number Guessing Game</h1>
        <p class="text-muted small mb-4">Guess a number between 1 and 100 (inclusive).</p>

        <div class="mb-3">
          <label class="form-label" for="guessInput">Your guess</label>
          <input
            id="guessInput"
            type="number"
            class="form-control"
            v-model.number="guessInput"
            :disabled="gameEnded"
            min="1"
            max="100"
            placeholder="Enter a number"
          />
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" class="btn btn-primary" :disabled="gameEnded" @click="checkGuess">
            Check Guess
          </button>
          <button type="button" class="btn btn-outline-secondary" :disabled="gameEnded" @click="giveUp">
            Give Up
          </button>
          <button type="button" class="btn btn-outline-primary" @click="startOver">
            Start Over
          </button>
        </div>

        <p class="mb-2" role="status"><strong>Message:</strong> {{ message }}</p>
        <p class="mb-3"><strong>Attempts left:</strong> {{ attemptsLeft }}</p>

        <div class="border rounded p-3 bg-light">
          <p class="mb-2 fw-semibold">Your guesses:</p>
          <p v-if="guesses.length === 0" class="text-muted mb-0">None yet.</p>
          <p v-else class="mb-0">
            <template v-for="(g, i) in guesses" :key="i">
              <span v-if="i > 0">, </span>{{ g }}
            </template>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="app.js"></script>
</body>
</html>
